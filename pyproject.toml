[project]
name = "gitpanel"
version = "0.1.0"
description = "PyCharm-style Git client for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=0.80", "rich>=13"]

[project.scripts]
gitpanel = "gitpanel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitpanel"]

# --- pixi -------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.12.*"
git = "*"
textual = "*"
rich = "*"

[tool.pixi.pypi-dependencies]
gitpanel = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"

[tool.pixi.feature.dev.pypi-dependencies]
textual-dev = "*"

[tool.pixi.environments]
default = ["dev"]

[tool.pixi.tasks]
start = "gitpanel"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
dev = "textual run --dev gitpanel.ui.app:GitPanelApp"
demo = "bash scripts/make_demo_repo.sh"

# --- tooling ----------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
