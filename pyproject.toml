[project]
name = "gitpanel"
version = "0.1.0"
description = "PyCharm-style Git client for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=0.80", "rich>=13"]

[project.optional-dependencies]
web = ["aiohttp>=3.9"]  # `gitpanel --web`: the browser UI prototype (gitpanel/web)
app = ["aiohttp>=3.9", "pywebview>=5"]  # `gitpanel --app`: the browser UI in its own window

[project.scripts]
gitpanel = "gitpanel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitpanel"]

# --- pixi -------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.12.*"
git = "*"
textual = "*"
rich = "*"
aiohttp = ">=3.14.5,<4"

[tool.pixi.pypi-dependencies]
gitpanel = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"

[tool.pixi.feature.dev.pypi-dependencies]
textual-dev = "*"

# `pixi run -e app app`: the web UI in a native window (pywebview + a web engine)
[tool.pixi.feature.app.target.linux-64.dependencies]
pywebview = ">=5"
pyqtwebengine = "*"  # Qt web engine: self-contained, no system WebKitGTK needed
qtpy = "*"

# conda-forge's pywebview is Linux-only; on macOS the PyPI wheel pulls in pyobjc (WKWebView)
[tool.pixi.feature.app.target.osx-arm64.pypi-dependencies]
pywebview = ">=5"

[tool.pixi.feature.app.target.osx-64.pypi-dependencies]
pywebview = ">=5"

[tool.pixi.feature.app.tasks]
app = "gitpanel --app"

[tool.pixi.environments]
default = ["dev"]
app = ["app"]

[tool.pixi.tasks]
start = "gitpanel"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
dev = "textual run --dev gitpanel.ui.app:GitPanelApp"
web = "gitpanel --web"
demo = "bash scripts/make_demo_repo.sh"

# --- tooling ----------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
